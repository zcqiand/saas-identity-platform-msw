name: ci

# 门禁镜像：与 .harness/stack.json 的 L1/L3/L4 一致（test-only）。
# 本仓是 mock 层库，无 Docker 镜像 / VPS 部署 -- 旧版 ci.yml 是从
# lab-management-system-nextjs 错抄的 deploy 链，已删。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

name: ci

# 门禁镜像：与 .harness/stack.json 的 L1/L3/L4 一致 + tag deploy。
# 2026-09-13 用户裁定：msw 有 prod 端 saas-msw.xiangru.uk，部署链照 react/vue/nextjs
# 模式重建（旧版 ci.yml 的 deploy 链曾是 lab-nextjs 错抄已删；本版按家族现行范式重写）。
# 前置：GitHub Repository Secrets 需 DOCKER_USERNAME/DOCKER_PASSWORD/VPS_HOST/
# VPS_USER/VPS_SSH_KEY/DATABASE_URL（msw.env 自举源）。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # M99.F01 seed-parity 对照物：tests/seed-parity.test.ts 深比 msw ↔ nextjs 两仓
      # seeds。CI 默认只 checkout 本仓 → 对照目录缺失 → 该组必红。把 nextjs 检出到
      # workspace 内 sibling-nextjs/（本地 suite 布局走另一候选路径，见测试 CANDIDATES）。
      - uses: actions/checkout@v4
        with:
          repository: zcqiand/saas-identity-platform-nextjs
          path: sibling-nextjs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  # tag push → test 绿 → docker build & push → VPS pull + restart
  # msw.env 自举由 deploy/saas-identity-platform-msw.sh 处理（DATABASE_URL 来自 secret）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 不传 fingerprint,走 TOFU
          envs: DATABASE_URL,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 每次都重拉 deploy 脚本
            # （旧版只在缺失时拉 → VPS 缓存旧脚本,修了部署链也白修）
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            echo "→ env on remote: DATABASE_URL_set=$([ -n "${DATABASE_URL:-}" ] && echo yes || echo no)"
            if [ ! -f msw.env ]; then
              if [ -n "${DATABASE_URL:-}" ]; then
                echo "→ msw.env will be bootstrapped by deploy script from DATABASE_URL env"
              else
                echo "ERROR: msw.env missing and DATABASE_URL secret not set, deploy script will fail-fast" >&2
              fi
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"

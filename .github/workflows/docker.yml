name: docker

# ADR-0012 B 强度：tag push → docker build & push
# 不在本仓复用 .github/workflows/ci.yml（后者是 nextjs 残留物；本 workflow 只负责
# docker 构建，测试走本地 gate.py）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/saas-identity-platform-msw:latest
            ${{ secrets.DOCKER_USERNAME }}/saas-identity-platform-msw:${{ github.ref_name }}
